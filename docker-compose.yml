services:
  postgresdb:
    image: postgres:17
    restart: unless-stopped
    container_name: probe-postgres

    environment:
      POSTGRES_USER: probe
      POSTGRES_PASSWORD: probe_local
      POSTGRES_DB: probe_dev

    ports:
      - "5434:5432"

    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
