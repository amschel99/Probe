# Railway: build the single-image Dockerfile (api + web, single origin).
# Railway injects $PORT; scripts/docker-start.sh binds the web app to it.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
